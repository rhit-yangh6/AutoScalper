services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}
      - TRADING_MODE=live  # live or paper
      - VNC_SERVER_PASSWORD=${VNC_PASSWORD:-changeme}
      - TIME_ZONE=America/Los_Angeles
      - TZ=America/Los_Angeles
      - READ_ONLY_API=no
      # 2FA Configuration
      - TWOFA_DEVICE=IB Key
      - TWOFA_TIMEOUT_ACTION=restart
      - RELOGIN_AFTER_TWOFA_TIMEOUT=yes
      - TWOFA_EXIT_INTERVAL=60
      # Session handling
      - EXISTING_SESSION_DETECTED_ACTION=primary
      # Daily restart at 11:00 PM LA time
      - AUTO_RESTART_TIME=23:00
    ports:
      - "127.0.0.1:4001:4003"  # Host 4001 → Container 4003 (live trading API)
      - "127.0.0.1:4002:4004"  # Host 4002 → Container 4004 (paper trading API)
      - "127.0.0.1:5900:5900"  # VNC for remote desktop access
    volumes:
      - gateway-settings:/root/Jts
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4003 || nc -z localhost 4004"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  gateway-settings:
    driver: local
