# Example configuration file for MNQ Futures AutoScalper

system:
  name: "MNQ Futures Scalping Bot"
  version: "2.0"
  dry_run: true  # true = no IBKR connection (simulated), false = connect to IBKR
  log_dir: "logs"

# TradingView Webhook Configuration
tradingview:
  webhook_port: 8080
  webhook_secret: "${TRADINGVIEW_WEBHOOK_SECRET}"

# Interactive Brokers Configuration
ibkr:
  host: "127.0.0.1"
  port: 4002  # 4002 for paper gateway, 4001 for live gateway
  client_id: 1

# Futures Configuration
futures:
  symbol: "MNQ"
  exchange: "CME"
  tick_size: 0.25
  point_value: 2.0  # $2 per point for MNQ

# Risk Management
risk:
  account_balance: 10000.0  # Fallback if IBKR balance unavailable

  # Position sizing
  # num_contracts > 0: fixed number of contracts per position
  # num_contracts = 0: auto-calculate based on account balance and margin
  num_contracts: 1
  margin_per_contract: 2000.0  # Fallback if IBKR margin fetch fails (auto-detected on startup)
  margin_buffer: 0.80          # Safety buffer: only use 80% of balance for margin (20% reserve)

  # Daily limits (dollar-based for futures)
  daily_max_loss: 500   # Stop trading if down $500
  max_loss_streak: 3    # Stop after 3 consecutive losses

  # IBKR daily maintenance window (UTC) - trading disabled during this time
  # Default: 23:00-01:00 UTC (6pm-8pm ET) - 2 hour window
  maintenance_start: "23:00"
  maintenance_end: "01:00"

# Telegram Notifications
telegram:
  enabled: false
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# Logging
logging:
  level: "INFO"
  file: "logs/autoscalper.log"
